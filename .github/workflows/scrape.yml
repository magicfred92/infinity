name: Scrape jobs

on:
  schedule:
    # ~07:00 in Switzerland (drifts by 1h between CET/CEST — acceptable
    # for a daily digest).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.main

      - name: Upload debug artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit updated job data
        run: |
          git config user.name "infinity-job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/sources_config.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh job listings"
          git push
